<div id="app"></div>
<div class="app-boot-state" id="appBootState" role="status" aria-live="polite">
    <div class="app-boot-card">
        <div class="app-boot-spinner" aria-hidden="true"></div>
        <p class="app-boot-title" id="appBootTitle">正在加载登录页面</p>
        <p class="app-boot-detail" id="appBootDetail">正在准备页面内容，请稍候。</p>
        <button type="button" class="app-boot-retry" onclick="location.reload()">重新加载</button>
    </div>
</div>
<script>
    (() => {
        let finished = false;
        const hash = location.hash;
        const isLanding = hash.startsWith('#/landing');
        const isAuthRoute = /^#\/(?:login|register|forgot-password|reset)(?:[/?]|$)/i.test(hash);
        const showFailure = () => {
            if (finished || !document.getElementById('appBootState')) return;
            const state = document.getElementById('appBootState');
            state.classList.add('is-error');
            document.getElementById('appBootTitle').textContent = isAuthRoute ? '登录页面加载失败' : '页面加载失败';
            document.getElementById('appBootDetail').textContent = '请检查网络后重新加载，无需先进入游客模式。';
        };
        if (isLanding) {
            document.getElementById('appBootTitle').textContent = '正在加载首页';
            document.getElementById('appBootDetail').textContent = '正在准备首页内容，请稍候。';
        } else if (!isAuthRoute) {
            document.getElementById('appBootTitle').textContent = '正在加载页面';
            document.getElementById('appBootDetail').textContent = '正在准备页面内容，请稍候。';
        }
        const isVisible = element => {
            if (!element) return false;
            const style = window.getComputedStyle(element);
            return style.display !== 'none'
                && style.visibility !== 'hidden'
                && Number.parseFloat(style.opacity || '1') >= 0.95
                && element.getBoundingClientRect().width > 0
                && element.getBoundingClientRect().height > 0;
        };
        const finish = () => {
            if (finished) return;
            const state = document.getElementById('appBootState');
            const target = isAuthRoute
                ? document.querySelector('#app .auth-container')
                : document.querySelector('#app > *');
            if (!state || !isVisible(target)) {
                window.requestAnimationFrame(finish);
                return;
            }
            finished = true;
            state.classList.add('is-ready');
            window.setTimeout(() => state.remove(), 220);
        };
        window.XBOARD_BOOT_FAIL = showFailure;
        window.requestAnimationFrame(finish);
        window.setTimeout(showFailure, 15000);
    })();
</script>

                    ['4. Hủy và hoàn tiền', 'Đơn chưa thanh toán có thể hủy bất kỳ lúc nào. Do dịch vụ số thường được giao ngay, đơn đã sử dụng thường không được hoàn, trừ khi pháp luật yêu cầu, chưa giao, bị tính phí trùng hoặc trái phép, hay có lỗi nghiêm trọng do chúng tôi không thể khắc phục. Yêu cầu phải gửi trong 7 ngày.'],
                    ['5. Sử dụng chấp nhận được', 'Không dùng dịch vụ để vi phạm pháp luật hoặc quyền của người khác, gửi thư rác hay mã độc, tấn công, quét, truy cập trái phép, phát tán nội dung cấm, hoặc chia sẻ hay bán thông tin truy cập khi chưa được phép. Chúng tôi có thể hạn chế để ngăn lạm dụng, bảo vệ hạ tầng hoặc tuân thủ pháp luật.'],
                    ['6. Tính sẵn sàng và thay đổi', 'Trừ khi gói ghi rõ SLA, chúng tôi không bảo đảm hoạt động liên tục, tuyến cố định, độ trễ, tốc độ, vị trí hay uy tín IP hoặc quyền truy cập nền tảng bên thứ ba. Bảo trì, tấn công, lỗi thượng nguồn, mạng địa phương và sự kiện ngoài kiểm soát có thể ảnh hưởng dịch vụ.'],
                    ['7. Trách nhiệm, đình chỉ và chấm dứt', 'Trong phạm vi pháp luật cho phép, dịch vụ được cung cấp theo tình trạng sẵn có. Chúng tôi không chịu trách nhiệm cho thiệt hại gián tiếp do sử dụng sai, cấu hình người dùng, chặn của bên thứ ba hoặc sự kiện ngoài kiểm soát. Tổng trách nhiệm thường giới hạn ở giá trị đơn bị ảnh hưởng. Vi phạm nghiêm trọng, gian lận, hoàn trả thanh toán hoặc rủi ro an ninh có thể dẫn đến đình chỉ.'],
                    ['8. Cập nhật, luật áp dụng và liên hệ', 'Chúng tôi có thể cập nhật Điều khoản do thay đổi dịch vụ, pháp luật hoặc vận hành và sẽ thông báo thay đổi quan trọng trên website hoặc tài khoản. Áp dụng pháp luật Cộng hòa Nhân dân Trung Hoa, không hạn chế quyền bảo vệ người tiêu dùng bắt buộc tại nơi bạn cư trú. Liên hệ: admin@zinc.run.']
                ],
                privacyIntro: 'Chính sách này giải thích cách ZINC thu thập, sử dụng và bảo vệ thông tin cá nhân khi bạn truy cập website, tạo tài khoản, mua hoặc dùng dịch vụ hay liên hệ hỗ trợ.',
                privacy: [
                    ['1. Thông tin thu thập', 'Có thể gồm email, mã tài khoản và hồ sơ xác thực; gói, số tiền, tiền tệ, trạng thái thanh toán và mã đơn; IP, thiết bị và trình duyệt, đăng nhập, mức sử dụng, thời gian kết nối và nhật ký an ninh; nội dung hỗ trợ; cookie hoặc lưu trữ cục bộ cần cho phiên, tùy chọn và bảo mật. Chúng tôi không lưu đầy đủ thông tin thẻ.'],
                    ['2. Mục đích và cơ sở pháp lý', 'Thông tin được dùng để tạo và bảo vệ tài khoản, cung cấp dịch vụ, xử lý đơn, hỗ trợ, ngăn gian lận và lạm dụng, duy trì độ tin cậy, thực hiện nghĩa vụ thuế và pháp lý và gửi thông báo cần thiết. Cơ sở gồm thực hiện hợp đồng, nghĩa vụ pháp luật, lợi ích hợp pháp về an toàn vận hành và sự đồng ý khi cần.'],
                    ['3. Chia sẻ và nhà cung cấp thanh toán', 'Chúng tôi không bán thông tin cá nhân. Chỉ dữ liệu cần thiết được chia sẻ với nhà cung cấp lưu trữ, mạng, an ninh, email, hỗ trợ, phân tích, thuế và thanh toán. Waffo Pancake và các nhà cung cấp khác xử lý dữ liệu thanh toán theo chính sách riêng.'],
                    ['4. Xử lý quốc tế và lưu giữ', 'Nhà cung cấp có thể xử lý dữ liệu ngoài quốc gia của bạn; khi cần, chúng tôi dùng biện pháp bảo vệ theo hợp đồng hoặc được công nhận. Hồ sơ chỉ được giữ trong thời gian cần để cung cấp dịch vụ, xử lý sự cố, ngăn lạm dụng và đáp ứng yêu cầu thuế, kế toán và pháp lý.'],
                    ['5. Bảo mật', 'Chúng tôi dùng mã hóa khi truyền, kiểm soát truy cập, bảo vệ thông tin đăng nhập, giám sát và giới hạn quyền quản trị. Không hệ thống nào an toàn tuyệt đối; hãy dùng mật khẩu riêng và báo ngay khi nghi ngờ truy cập trái phép.'],
                    ['6. Quyền của bạn và cookie', 'Theo luật áp dụng, bạn có thể yêu cầu truy cập, sửa, xóa, hạn chế, nhận bản sao, phản đối xử lý, rút lại đồng ý hoặc đóng tài khoản. Cookie và lưu trữ cục bộ thiết yếu phục vụ đăng nhập, an ninh và ngôn ngữ; chặn chúng có thể làm hỏng chức năng.'],
                    ['7. Trẻ em, cập nhật và liên hệ', 'Dịch vụ không dành cho người dưới 18 tuổi. Chúng tôi có thể cập nhật Chính sách do thay đổi pháp lý, kỹ thuật hoặc dịch vụ và sẽ công bố ngày mới. Yêu cầu: admin@zinc.run.']
                ]
            }
        };

        const languageByLabel = {
            '简体中文': 'zh-CN', '繁體中文': 'zh-TW', English: 'en-US', '日本語': 'ja-JP',
            '한국어': 'ko-KR', 'Русский': 'ru-RU', 'فارسی': 'fa-IR', 'Tiếng Việt': 'vi-VN'
        };
        const getLanguage = () => {
            const selectedLabel = document.querySelector('.language-btn img[alt]')?.alt;
            return languageByLabel[selectedLabel] || (legalCopy[localStorage.getItem('language')] ? localStorage.getItem('language') : 'en-US');
        };
        const getCopy = () => legalCopy[getLanguage()];

        const renderDocument = () => {
            if (!activeDocument) return;
            const copy = getCopy();
            const isTerms = activeDocument === 'terms';
            const title = isTerms ? copy.termsTitle : copy.privacyTitle;
            const sections = isTerms ? copy.terms : copy.privacy;

            dialogTitle.textContent = title;
            dialogContent.replaceChildren();
            const meta = document.createElement('p');
            meta.className = 'legal-meta';
            meta.textContent = copy.effective;
            const intro = document.createElement('p');
            intro.className = 'legal-intro';
            intro.textContent = isTerms ? copy.termsIntro : copy.privacyIntro;
            dialogContent.append(meta, intro);
            sections.forEach(([heading, body]) => {
                const sectionHeading = document.createElement('h3');
                sectionHeading.textContent = heading;
                const paragraph = document.createElement('p');
                paragraph.textContent = body;
                dialogContent.append(sectionHeading, paragraph);
            });
            dialog.dir = getLanguage() === 'fa-IR' ? 'rtl' : 'ltr';
            closeButton.setAttribute('aria-label', copy.close);
            closeButton.title = copy.close;
        };

        const renderLabels = () => {
            const copy = getCopy();
            document.getElementById('pricingLabel').textContent = copy.pricing;
            document.getElementById('termsLabel').textContent = copy.termsTitle;
            document.getElementById('privacyLabel').textContent = copy.privacyTitle;
            document.getElementById('supportLabel').textContent = copy.support;
            if (dialog.open) renderDocument();

        };

        document.querySelectorAll('[data-legal-doc]').forEach(button => {
            button.addEventListener('click', () => {
                activeDocument = button.dataset.legalDoc;
                renderDocument();
                dialog.showModal();
            });
        });
        closeButton.addEventListener('click', () => dialog.close());
        dialog.addEventListener('click', event => {
            if (event.target === dialog) dialog.close();
        });

        const updateFooter = () => {
            const route = location.hash.replace(/^#\/?/, '').split(/[?&]/, 1)[0];
            const isLanding = route === '' || route === 'landing';
            footer.hidden = false;
            footer.classList.toggle('is-landing', isLanding);
        };

        updateFooter();
        renderLabels();
        window.addEventListener('hashchange', updateFooter);
        window.addEventListener('languageChanged', renderLabels);
        new MutationObserver(renderLabels).observe(document.getElementById('app'), { childList: true, subtree: true, attributes: true, attributeFilter: ['alt'] });
    })();
</script>
</body>
</html>
